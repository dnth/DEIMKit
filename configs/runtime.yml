print_freq: 100
output_dir: './logs'
checkpoint_freq: 12


sync_bn: True
# Changes to avoid RuntimeError
#   RuntimeError: Expected to have finished reduction in the prior iteration before starting a new one.
#   False -> True
find_unused_parameters: True


use_amp: False
scaler:
  type: GradScaler
  enabled: True


use_ema: False
ema:
  type: ModelEMA
  decay: 0.9999
  warmups: 1000
